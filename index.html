<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Fleet Hangar - Select Your Vessel</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a120a;
      font-family: "Georgia", "Times New Roman", serif;
    }

    .game-container {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 100vw;
      max-height: 100vh;
      margin: 0 auto;
      background: url("assets/fleet-hangar-bg.jpg") center center / cover no-repeat;
      aspect-ratio: 2 / 3;
    }

    @media (min-aspect-ratio: 2/3) {
      .game-container {
        height: 100vh;
        width: calc(100vh * 2 / 3);
      }
    }
    @media (max-aspect-ratio: 2/3) {
      .game-container {
        width: 100vw;
        height: calc(100vw * 3 / 2);
      }
    }

    /* ========== HOTSPOTS ========== */

    .hotspot-world-map {
      position: absolute;
      top: 7.5%;
      left: 3.5%;
      width: 18%;
      height: 14%;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s, box-shadow 0.2s;
    }
    .hotspot-world-map:active {
      background: rgba(255, 220, 150, 0.15);
      box-shadow: 0 0 12px rgba(255, 200, 100, 0.4);
    }

    .hotspot-crew {
      position: absolute;
      top: 21.5%;
      left: 3.5%;
      width: 18%;
      height: 4.5%;
      border-radius: 4px;
      cursor: pointer;
    }
    .hotspot-crew:active {
      background: rgba(255, 220, 150, 0.15);
    }

    .left-icons {
      position: absolute;
      top: 28%;
      left: 3.2%;
      width: 8.5%;
      display: flex;
      flex-direction: column;
      gap: 2.2%;
    }

    .icon-btn {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 8px;
      cursor: pointer;
      background: transparent;
      border: none;
      transition: transform 0.15s, background 0.2s, box-shadow 0.2s;
    }
    .icon-btn:active {
      transform: scale(0.92);
      background: rgba(255, 220, 150, 0.2);
      box-shadow: 0 0 10px rgba(255, 200, 80, 0.5);
    }
    .icon-btn.selected {
      background: rgba(255, 210, 120, 0.25);
      box-shadow: 0 0 14px rgba(255, 190, 60, 0.55);
    }

    /* Blimp Profile – right panel that shows the selected ship */
    .blimp-profile {
      position: absolute;
      top: 6.8%;
      right: 3.2%;
      width: 19.5%;
      height: 28%;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: pointer;
      transition: box-shadow 0.25s;
    }
    .blimp-profile:active {
      box-shadow: inset 0 0 20px rgba(255, 200, 100, 0.25);
    }
    .blimp-profile img {
      max-width: 92%;
      max-height: 88%;
      object-fit: contain;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.45));
      transition: transform 0.3s ease, opacity 0.3s ease;
    }
    .blimp-profile img.fade {
      opacity: 0;
      transform: scale(0.85);
    }

    /* Vessel selection grid */
    .vessel-grid {
      position: absolute;
      bottom: 11.5%;
      left: 7.5%;
      width: 85%;
      height: 24%;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 2.8% 2.2%;
    }

    .vessel-slot {
      position: relative;
      border-radius: 6px;
      cursor: pointer;
      background: transparent;
      border: none;
      overflow: hidden;
      transition: transform 0.15s, background 0.2s, box-shadow 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4%;
    }
    .vessel-slot:active {
      transform: scale(0.94);
    }
    .vessel-slot.selected {
      background: rgba(255, 215, 100, 0.22);
      box-shadow: 0 0 16px rgba(255, 190, 50, 0.6),
                  inset 0 0 12px rgba(255, 220, 150, 0.3);
    }
    .vessel-slot img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
      pointer-events: none;
    }
    .vessel-slot.locked {
      cursor: not-allowed;
      opacity: 0.55;
    }
    .vessel-slot.locked::after {
      content: "🔒";
      position: absolute;
      font-size: clamp(12px, 3.5vw, 20px);
      color: rgba(255, 230, 180, 0.7);
      text-shadow: 0 1px 3px #000;
    }

    @media (hover: hover) {
      .vessel-slot:hover:not(.locked),
      .icon-btn:hover,
      .hotspot-world-map:hover {
        background: rgba(255, 220, 150, 0.1);
      }
    }

    /* Toast */
    .status-toast {
      position: absolute;
      top: 48%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(30, 20, 10, 0.88);
      color: #f5e6c8;
      padding: 12px 22px;
      border-radius: 8px;
      border: 1px solid rgba(200, 160, 80, 0.5);
      font-size: clamp(12px, 3.2vw, 15px);
      letter-spacing: 0.4px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
      z-index: 100;
      text-align: center;
      max-width: 70%;
      box-shadow: 0 6px 20px rgba(0,0,0,0.5);
    }
    .status-toast.show {
      opacity: 1;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      border: 0;
    }
  </style>
</head>
<body>
  <div class="game-container" id="hangar">
    <h1 class="sr-only">Fleet Hangar – Select Your Vessel</h1>

    <!-- World Map -->
    <div class="hotspot-world-map" id="btn-world-map" role="button" aria-label="Open World Map"></div>

    <!-- Available Crew -->
    <div class="hotspot-crew" id="btn-crew" role="button" aria-label="View Available Crew"></div>

    <!-- Left vertical icons -->
    <div class="left-icons">
      <button class="icon-btn" id="btn-fleet" aria-label="Fleet / Blimps" title="Fleet"></button>
      <button class="icon-btn" id="btn-upgrades" aria-label="Upgrades / Gear" title="Upgrades"></button>
      <button class="icon-btn" id="btn-crew-icon" aria-label="Crew / Outfits" title="Crew"></button>
    </div>

    <!-- Blimp Profile (shows selected ship) -->
    <div class="blimp-profile" id="blimp-profile" role="button" aria-label="Blimp Profile">
      <img id="profile-img" src="" alt="Selected vessel" style="display:none;" />
    </div>

    <!-- Vessel selection grid -->
    <div class="vessel-grid" id="vessel-grid"></div>

    <!-- Feedback toast -->
    <div class="status-toast" id="toast"></div>
  </div>

  <script>
    // ========== BLIMP DATA (in upload order) ==========
    const blimps = [
      { id: 1, name: "Zeppelin Ace",    src: "assets/blimp-01-zeppelin-ace.jpg" },
      { id: 2, name: "Clockwork",       src: "assets/blimp-02-clockwork.jpg" },
      { id: 3, name: "Pirate's Pride",  src: "assets/blimp-03-pirate.jpg" },
      { id: 4, name: "Thunderbolt",     src: "assets/blimp-04-lightning.jpg" },
      { id: 5, name: "Little Spy",      src: "assets/blimp-05-little-spy.jpg" },
      { id: 6, name: "Sky Festival",    src: "assets/blimp-06-white-pennant.jpg" },
      { id: 7, name: "Chrome Ghost",    src: "assets/blimp-07-chrome.jpg" },
      { id: 8, name: "Royal Velvet",    src: "assets/blimp-08-purple.jpg" },
      { id: 9, name: "Deco Liner",      src: "assets/blimp-09-deco-liner.jpg" },
      { id:10, name: "Cargo King",      src: "assets/blimp-10-cargo-king.jpg" }
    ];

    // How many are unlocked at start (change as needed)
    const UNLOCKED_COUNT = 10; // all unlocked for now

    const toastEl   = document.getElementById("toast");
    const profileImg = document.getElementById("profile-img");
    const grid      = document.getElementById("vessel-grid");
    let toastTimer  = null;
    let selectedId  = null;

    function showToast(msg, duration = 1500) {
      toastEl.textContent = msg;
      toastEl.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove("show"), duration);
    }

    function selectBlimp(index) {
      const blimp = blimps[index];
      if (!blimp) return;

      // Update selection highlight
      document.querySelectorAll(".vessel-slot").forEach(s => s.classList.remove("selected"));
      const slot = document.querySelector(`.vessel-slot[data-index="${index}"]`);
      if (slot) slot.classList.add("selected");

      // Animate profile image change
      if (selectedId !== null) {
        profileImg.classList.add("fade");
        setTimeout(() => {
          profileImg.src = blimp.src;
          profileImg.alt = blimp.name;
          profileImg.style.display = "block";
          profileImg.classList.remove("fade");
        }, 180);
      } else {
        profileImg.src = blimp.src;
        profileImg.alt = blimp.name;
        profileImg.style.display = "block";
      }

      selectedId = blimp.id;
      showToast(blimp.name);
    }

    // Build the 10 slots
    blimps.forEach((blimp, i) => {
      const slot = document.createElement("button");
      slot.className = "vessel-slot";
      slot.dataset.index = i;
      slot.setAttribute("aria-label", `Select ${blimp.name}`);

      if (i >= UNLOCKED_COUNT) {
        slot.classList.add("locked");
      } else {
        const img = document.createElement("img");
        img.src = blimp.src;
        img.alt = blimp.name;
        img.loading = "lazy";
        slot.appendChild(img);
      }

      slot.addEventListener("click", () => {
        if (slot.classList.contains("locked")) {
          showToast("Locked – complete missions to unlock");
          return;
        }
        selectBlimp(i);
      });

      grid.appendChild(slot);
    });

    // Pre-select the first blimp
    selectBlimp(0);

    // ===== Other UI buttons =====
    document.getElementById("btn-fleet").addEventListener("click", () => {
      document.querySelectorAll(".icon-btn").forEach(b => b.classList.remove("selected"));
      document.getElementById("btn-fleet").classList.add("selected");
      showToast("Fleet view");
    });
    document.getElementById("btn-upgrades").addEventListener("click", () => {
      document.querySelectorAll(".icon-btn").forEach(b => b.classList.remove("selected"));
      document.getElementById("btn-upgrades").classList.add("selected");
      showToast("Upgrades & Workshop");
    });
    document.getElementById("btn-crew-icon").addEventListener("click", () => {
      document.querySelectorAll(".icon-btn").forEach(b => b.classList.remove("selected"));
      document.getElementById("btn-crew-icon").classList.add("selected");
      showToast("Crew & Outfits");
    });
    document.getElementById("btn-world-map").addEventListener("click", () => {
      showToast("Opening World Map…");
    });
    document.getElementById("btn-crew").addEventListener("click", () => {
      showToast("Available Crew roster");
    });
    document.getElementById("blimp-profile").addEventListener("click", () => {
      if (selectedId) {
        const b = blimps.find(x => x.id === selectedId);
        showToast(`${b.name} – equip & customize`);
      }
    });
  </script>
</body>
</html>
